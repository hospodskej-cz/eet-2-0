name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install xmllint (XSD contract tests)
        run: command -v xmllint || (sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils)
      - run: bun install --frozen-lockfile
      - name: Cache playground certificates (SHA-256 pinned in sources.json)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/playground
          key: playground-certs-${{ hashFiles('docs/sources/sources.json') }}
      - run: bun run certs:playground
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  core-compat:
    name: Core, ingest, queue on ${{ matrix.runtime.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - { name: "Node 22.18", node: "22.18.0" }
          - { name: "Node 24", node: "24" }
          - { name: "Deno 2", deno: "v2.x" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build:core
      - run: bun run build:ingest
      - run: bun run build:queue
      - if: matrix.runtime.node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.runtime.node }}
      - if: matrix.runtime.node
        run: |
          node packages/core/test/compat/smoke.mjs
          node packages/ingest/test/compat/smoke.mjs
          node packages/queue/test/compat/smoke.mjs
      - if: matrix.runtime.deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.runtime.deno }}
      - if: matrix.runtime.deno
        run: |
          deno run packages/core/test/compat/smoke.mjs
          deno run packages/ingest/test/compat/smoke.mjs
          deno run packages/queue/test/compat/smoke.mjs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Cache playground certificates (SHA-256 pinned in sources.json)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/playground
          key: playground-certs-${{ hashFiles('docs/sources/sources.json') }}
      - run: bun run certs:playground
      - run: docker build -t eet-gateway:ci .
      - name: Smoke test the container (sends nothing to EET)
        run: scripts/docker-smoke.sh eet-gateway:ci

  examples:
    name: Integration examples
    runs-on: ubuntu-latest
    env:
      EET_URL: http://localhost:8080
      EET_API_KEY: examples-key-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Start the real API over a fake EET (scripts/examples-server.ts)
        run: |
          bun scripts/examples-server.ts 8080 > examples-server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf "$EET_URL/health" > /dev/null && exit 0; sleep 1; done
          cat examples-server.log; exit 1
      - name: curl
        run: examples/curl/send.sh
      - name: PHP
        run: php examples/php/send.php
      - name: Python
        run: python3 examples/python/send.py
      - name: C#
        run: dotnet run --project examples/csharp/EetExample
