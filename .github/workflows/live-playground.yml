name: Live playground

# Real round trips against the EET playground with the shared test certificates (three made-up
# sales per run; the playground registers nothing). Not on push: it depends on an external
# service and would add noise to it. Tuesday avoids the Thursday 20:00–06:00 maintenance window.
on:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run certs:playground
      - run: bun run test:live
