name: Live playground

# Real round trips against the EET playground with the shared test certificates (three made-up
# sales per run; the playground registers nothing). Not on push: it depends on an external
# service and would add noise to it. Tuesday avoids the Thursday 20:00–06:00 maintenance window.
#
# pg.trzbyeet.gov.cz does not accept connections from GitHub-hosted runners (verified
# 2026-10-25: IPv4 TCP connect times out, no IPv6 route; SPEC_NOTES §15). Set the repository
# variable LIVE_RUNNER to the label of a self-hosted runner that can reach it (e.g. one in CZ);
# until then the schedule is skipped and manual runs fall back to ubuntu-latest.
on:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || vars.LIVE_RUNNER != ''
    runs-on: ${{ vars.LIVE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run certs:playground
      # Diagnostics only: shows whether the runner can reach the playground at all (CORS preflight,
      # rozhraní §2.3.3, answers 204 without sending a sale). Never fails the job by itself.
      - name: Playground reachability
        run: |
          getent ahosts pg.trzbyeet.gov.cz | awk '{print $1}' | sort -u || echo "DNS: no answer"
          for family in -4 -6; do
            curl $family -sS -o /dev/null --max-time 15 -X OPTIONS \
              -H "Origin: https://example.org" -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: Content-Type, SOAPAction" \
              -w "IPv${family#-}: HTTP %{http_code} ip=%{remote_ip} connect=%{time_connect}s total=%{time_total}s\n" \
              https://pg.trzbyeet.gov.cz/eet/services/EETServiceSOAP/v4 || echo "IPv${family#-}: curl exit $?"
          done
          curl -4 -sS -o /dev/null --max-time 15 -w "eet.gov.cz IPv4: HTTP %{http_code} ip=%{remote_ip}\n" https://eet.gov.cz/ || true
      - run: bun run test:live
