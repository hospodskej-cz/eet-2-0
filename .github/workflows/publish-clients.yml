name: Publish clients

# Publishes the API clients (clients/) when a tag `clients-vX.Y.Z` is pushed. The tag has to match
# the version in all four clients (checked first). Each registry is switched on by its own
# repository variable, so nothing is published until the maintainer has set that registry up:
#   PUBLISH_PYPI      "true"  PyPI over trusted publishing (OIDC, no token)
#   PUBLISH_NUGET     "true"  nuget.org; NUGET_USER (trusted publishing) or secret NUGET_API_KEY
#   PUBLISH_MAVEN     "true"  Maven Central (Central Portal): secrets MAVEN_CENTRAL_USERNAME and
#                             MAVEN_CENTRAL_PASSWORD (portal user token), MAVEN_GPG_PRIVATE_KEY and
#                             MAVEN_GPG_PASSPHRASE (signing key); namespace io.github.hospodskej-cz
#   PUBLISH_PACKAGIST "true"  mirrors clients/php to hospodskej-cz/eet-gateway-php (Packagist needs
#                             composer.json in the repository root); secret PHP_MIRROR_TOKEN (fine-grained
#                             token, Contents: read and write on that repository only)
# Setup: clients/README.md, "Publikace".
on:
  push:
    tags: ["clients-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish when run by hand (default: from the tag the run is on)"
        required: false

permissions:
  contents: read

concurrency:
  group: publish-clients
  cancel-in-progress: false

jobs:
  verify:
    name: Versions match the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="${INPUT_VERSION:-${GITHUB_REF_NAME#clients-v}}"
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' clients/python/pyproject.toml)
          cs=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' clients/dotnet/src/EetGateway.Client/EetGateway.Client.csproj)
          pyc=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' clients/python/src/eet_gateway_client/client.py)
          php=$(sed -n "s/.*const VERSION = '\(.*\)';/\1/p" clients/php/src/Client.php)
          csc=$(sed -n 's/.*const string Version = "\(.*\)";/\1/p' clients/dotnet/src/EetGateway.Client/EetGatewayClient.cs)
          mvn=$(sed -n 's|^  <version>\(.*\)</version>|\1|p' clients/java/pom.xml)
          jv=$(sed -n 's/.*String VERSION = "\(.*\)";/\1/p' clients/java/src/main/java/cz/hospodskej/eetgateway/EetGatewayClient.java)
          echo "tag=$tag pyproject=$py __version__=$pyc csproj=$cs Version=$csc Client::VERSION=$php pom=$mvn VERSION=$jv"
          for v in "$py" "$pyc" "$cs" "$csc" "$php" "$mvn" "$jv"; do
            [ "$v" = "$tag" ] || { echo "::error::version $v does not match tag clients-v$tag"; exit 1; }
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  pypi:
    name: PyPI
    needs: verify
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build clients/python --outdir dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true

  nuget:
    name: NuGet
    needs: verify
    if: vars.PUBLISH_NUGET == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing (when NUGET_USER is set)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: dotnet pack clients/dotnet/src/EetGateway.Client --configuration Release --output nupkg
      - name: Temporary API key from nuget.org trusted publishing
        id: login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          [ -n "$NUGET_KEY" ] || { echo "::error::no NuGet credentials (variable NUGET_USER or secret NUGET_API_KEY)"; exit 1; }
          dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  maven:
    name: Maven Central
    needs: verify
    if: vars.PUBLISH_MAVEN == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Already on Maven Central?
        id: published
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://repo1.maven.org/maven2/io/github/hospodskej-cz/eet-gateway-client/$VERSION/eet-gateway-client-$VERSION.pom")
          echo "repo1.maven.org answered HTTP $code"
          if [ "$code" = 200 ]; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi
      - name: Sign, upload and publish
        if: steps.published.outputs.done != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -ntp -f clients/java/pom.xml -Prelease deploy
      - name: What went into the bundle (only when the upload failed)
        if: failure()
        run: find clients/java/target/central-staging clients/java/target -maxdepth 7 -type f \( -path '*central-staging*' -o -name '*.jar' -o -name '*.pom' -o -name '*.asc' \) | sort

  packagist:
    name: Mirror PHP client for Packagist
    needs: verify
    if: vars.PUBLISH_PACKAGIST == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the subtree split needs the history of clients/php
          persist-credentials: false # else the job token overrides the mirror token below
      - name: Push clients/php (with its history) and the version tag to the mirror
        env:
          MIRROR_TOKEN: ${{ secrets.PHP_MIRROR_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "$MIRROR_TOKEN" ] || { echo "::error::secret PHP_MIRROR_TOKEN is missing"; exit 1; }
          MIRROR_TOKEN=$(printf %s "$MIRROR_TOKEN" | LC_ALL=C tr -cd 'A-Za-z0-9_') # keep token characters only: a pasted secret may carry a newline or a BOM
          remote="https://x-access-token:${MIRROR_TOKEN}@github.com/hospodskej-cz/eet-gateway-php.git"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $MIRROR_TOKEN" https://api.github.com/repos/hospodskej-cz/eet-gateway-php)
          echo "mirror token check: HTTP $code, ${#MIRROR_TOKEN} characters, starts with ${MIRROR_TOKEN:0:11}"
          [ "$code" = 200 ] || { echo "::error::PHP_MIRROR_TOKEN is not accepted by GitHub (HTTP $code)"; exit 1; }
          sha=$(git subtree split --prefix=clients/php)
          git push "$remote" "$sha:refs/heads/main"
          if git ls-remote --exit-code --tags "$remote" "refs/tags/v$VERSION" > /dev/null; then
            echo "tag v$VERSION is already on the mirror, leaving it"
          else
            git push "$remote" "$sha:refs/tags/v$VERSION"
          fi
      # Packagist reads the new tag itself when the repository has its GitHub hook; this call is
      # for the case without it and only runs when the token is set.
      - name: Tell Packagist
        env:
          PACKAGIST_USER: ${{ vars.PACKAGIST_USER }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          [ -n "$PACKAGIST_TOKEN" ] || { echo "no PACKAGIST_TOKEN, relying on the GitHub hook"; exit 0; }
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"repository":{"url":"https://packagist.org/packages/hospodskej-cz/eet-gateway-client"}}' \
            "https://packagist.org/api/update-package?username=$PACKAGIST_USER&apiToken=$PACKAGIST_TOKEN"
