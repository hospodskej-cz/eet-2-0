name: Release

# release-please keeps a release PR up to date from Conventional Commits on main. Merging it
# tags vX.Y.Z and creates the GitHub Release; then the binaries are built, run on Linux, macOS
# and Windows, and attached with SHA256SUMS. The Docker image is pushed to GHCR only when the
# repository variable PUBLISH_DOCKER is "true". npm publishing waits for OQ7 (CONTRIBUTING.md).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Run CI on the release PR (a PR opened with GITHUB_TOKEN triggers no workflows)
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: gh workflow run ci.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"

  binaries:
    name: Build binaries
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build:binaries
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eet-binaries
          path: dist/bin/
          retention-days: 7

  smoke:
    name: Smoke ${{ matrix.binary }}
    needs: [release-please, binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, binary: eet-linux-x64 }
          - { os: macos-latest, binary: eet-darwin-arm64 }
          - { os: windows-latest, binary: eet-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run certs:playground
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eet-binaries
          path: dist/bin
      - name: Run the binary through its commands (sends nothing to EET)
        shell: bash
        run: |
          chmod +x "dist/bin/${{ matrix.binary }}"
          scripts/binary-smoke.sh "dist/bin/${{ matrix.binary }}"

  attach:
    name: Attach binaries to the release
    needs: [release-please, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eet-binaries
          path: dist/bin
      - run: gh release upload "$TAG" dist/bin/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}

  docker:
    name: Docker image to GHCR
    needs: release-please
    if: needs.release-please.outputs.created == 'true' && vars.PUBLISH_DOCKER == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Build and push
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:$VERSION" -t "$image:latest" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.version="$VERSION" .
          docker push "$image:$VERSION"
          docker push "$image:latest"
