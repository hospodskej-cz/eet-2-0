name: Release

# release-please keeps a release PR up to date from Conventional Commits on main. Merging it
# tags vX.Y.Z and creates the GitHub Release; then:
#   - the binaries are built, run on Linux, macOS and Windows, and attached with SHA256SUMS and a
#     CycloneDX SBOM (and, in a public repository, a GitHub build provenance attestation);
#   - the npm packages are built and verified (always), and published with npm provenance over
#     trusted publishing (OIDC) only when the repository variable PUBLISH_NPM is "true";
#   - the Docker image is pushed to GHCR (linux/amd64 + linux/arm64, SBOM and provenance
#     attached, signed keyless with cosign) only when the repository variable PUBLISH_DOCKER is
#     "true".
# Setup the owner has to do once: CONTRIBUTING.md, "Publikace".
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    name: Build binaries
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # build provenance attestation (public repositories)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build:binaries
      - name: Licence files next to the binaries
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md dist/bin/
          (cd dist/bin && sha256sum LICENSE THIRD_PARTY_NOTICES.md >> SHA256SUMS)
      - name: SBOM (CycloneDX) of the binaries, listed in SHA256SUMS
        run: |
          bun run gen:sbom
          (cd dist/bin && sha256sum eet-gateway.cdx.json >> SHA256SUMS && cat SHA256SUMS)
      # Attestations of private repositories need GitHub Enterprise Cloud; skipped there.
      - name: Attest build provenance of the binaries and the SBOM
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/bin/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eet-binaries
          path: dist/bin/
          retention-days: 7

  smoke:
    name: Smoke ${{ matrix.binary }}
    needs: [release-please, binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, binary: eet-linux-x64 }
          - { os: macos-latest, binary: eet-darwin-arm64 }
          - { os: windows-latest, binary: eet-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run certs:playground
        shell: bash # needs unzip; on Windows it comes with Git Bash
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eet-binaries
          path: dist/bin
      - name: Run the binary through its commands (sends nothing to EET)
        shell: bash
        run: |
          chmod +x "dist/bin/${{ matrix.binary }}"
          scripts/binary-smoke.sh "dist/bin/${{ matrix.binary }}"

  attach:
    name: Attach binaries to the release
    needs: [release-please, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eet-binaries
          path: dist/bin
      - run: gh release upload "$TAG" dist/bin/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}

  # Builds and checks the npm tarballs on every release, whether or not they get published, so a
  # broken package shows up here and not on the day PUBLISH_NPM is switched on.
  packages:
    name: Build and verify npm packages
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run pack:packages
      - name: Install the tarballs in an empty project and import them (Node, Bun, TypeScript)
        run: bun run verify:packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eet-npm-packages
          path: dist/npm/
          retention-days: 7

  # Publishing runs in its own job with nothing but the verified tarballs: no checkout, no
  # install scripts, and the only credential is the short-lived OIDC token (npm trusted
  # publishing, no NPM_TOKEN secret). Needs the repository to be public.
  npm:
    name: Publish to npm
    needs: [release-please, smoke, packages]
    if: needs.release-please.outputs.created == 'true' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing + provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: npm must support trusted publishing (11.5.1 or newer)
        run: |
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eet-npm-packages
          path: dist/npm
      - name: Publish in dependency order (skips versions that are already on the registry)
        working-directory: dist/npm
        run: |
          while read -r tarball; do
            name=$(tar -xzOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            version=$(tar -xzOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already on npm, skipping"
              continue
            fi
            echo "Publishing $name@$version"
            npm publish "./$tarball" --provenance --access public
          done < publish-order.txt

  docker:
    name: Docker image to GHCR
    needs: release-please
    if: needs.release-please.outputs.created == 'true' && vars.PUBLISH_DOCKER == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # The build stage runs on the runner's own architecture and only produces JavaScript, so
      # the arm64 image needs no emulation.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ needs.release-please.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          # BuildKit attestations stored next to the image in the registry.
          provenance: mode=max
          sbom: true
      # Keyless signing records the repository and workflow in the public Sigstore log, so it
      # runs only for public repositories.
      - name: Install cosign
        if: github.event.repository.private == false
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image digest (keyless) and check the signature
        if: github.event.repository.private == false
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
